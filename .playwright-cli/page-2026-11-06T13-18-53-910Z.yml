      - generic [ref=e217]:
        - article [ref=e218]:
          - heading "Four weeks of waiting" [level=3] [ref=e219]
          - paragraph [ref=e220]: "Advent opens the Church’s year. It begins on the fourth Sunday before Christmas and ends on Christmas Eve. Its mood is quiet expectation rather than celebration: the Gloria falls silent at Sunday Mass, and the readings turn to the prophets, to John the Baptist, and to Mary."
        - article [ref=e221]:
          - heading "Violet and rose" [level=3] [ref=e222]
          - paragraph [ref=e223]: Violet, the colour of preparation and repentance, is worn through the season. Rose, a lightening of violet, marks a Sunday of rejoicing as Christmas draws near.
        - article [ref=e226]:
          - heading "The wreath" [level=3] [ref=e227]
          - paragraph [ref=e228]: An unbroken circle for God’s eternity, evergreens for life that does not fade. One candle is lit each Sunday, so the light grows as the darkest days of the year arrive. The white candle in the centre waits for Christmas.
